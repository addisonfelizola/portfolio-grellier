name: Rename portfolio file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename portfolio file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f index.html
          git mv addison-felizola-portfolio-grellier-style.html index.html
          git commit -m "Rename portfolio file to index.html"
          git push
